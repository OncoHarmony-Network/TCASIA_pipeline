# Copy this file before use and replace all placeholder paths.
samples: config/samples.tsv
output_dir: /path/to/output/as_calling
bam_dir: /path/to/output/alignment/aligned

ref: /path/to/references/gencode.v34.annotation.gtf
GFF: /path/to/references/gencode.v34.annotation.gff3
MAJIQ_license: /path/to/majiq_license_academic_official.lic
suppa2_events: /path/to/references/gencode.v34.events.ioe
SALMON_INDEX: /path/to/references/gencode.v34.transcripts.salmon.index

read_len: 150
strandness: fr-firststrand

threads:
  rmats: 10
  majiq: 8
  voila: 4
  salmon: 8
  spladder: 8

rmats:
  cstat: 0.0001
  extra: ""

majiq:
  genome: hg38
  minreads: 10

suppa2:
  min_tpm: 1

spladder:
  confidence: 3
  merge_strategy: single
  event_types: exon_skip,intron_retention,alt_3prime,alt_5prime,mutex_exons
